name: Tubify Full ad and logo probe
on:
  workflow_dispatch:
    inputs:
      new_tag:
        default: v0.1.41
      old_tag:
        default: v0.1.40
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.new_tag }} -p '*-x86_64.apk' -D apks/new
          gh release download ${{ inputs.old_tag }} -p '*-x86_64.apk' -D apks/old
      - name: Probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: bash qa/probe_ads.sh "$(ls apks/new/*.apk | head -1)" "$(ls apks/old/*.apk | head -1)" probe-out
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-ads
          path: probe-out
