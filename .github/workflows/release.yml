name: Tubify release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Tubify source
        run: |
          set -e
          if [ ! -f app/build.gradle.kts ]; then
            tar xzf src.tar.gz
          fi
          git config user.email "tubify-ci@users.noreply.github.com"
          git config user.name "Tubify CI"
          git add -A
          git diff --cached --quiet || git commit -m "Tubify source (CI)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Decode keystore
        run: |
          mkdir -p /tmp/sign
          echo "${{ secrets.TUBIFY_KEYSTORE_B64 }}" | base64 -d > /tmp/sign/tubify.p12

      - name: Build release APKs
        env:
          TUBIFY_STORE_FILE: /tmp/sign/tubify.p12
          TUBIFY_STORE_PASSWORD: ${{ secrets.TUBIFY_KEYSTORE_PASSWORD }}
          TUBIFY_KEY_PASSWORD: ${{ secrets.TUBIFY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :lite:assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -e
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *universal-release.apk) cp "$f" out/Tubify-v0.1.13-0-universal.apk ;;
              *arm64-v8a-release.apk) cp "$f" out/Tubify-v0.1.13-arm64-v8a.apk ;;
              *armeabi-v7a-release.apk) cp "$f" out/Tubify-v0.1.13-armeabi-v7a.apk ;;
              *x86_64-release.apk) cp "$f" out/Tubify-v0.1.13-x86_64.apk ;;
            esac
          done
          ls -l out
          for n in 0-universal arm64-v8a armeabi-v7a x86_64; do test -f "out/Tubify-v0.1.13-$n.apk"; done
          cp lite/build/outputs/apk/release/lite-release.apk out/Tubify-Lite-v0.1.13.apk
          test -f out/Tubify-Lite-v0.1.13.apk

      - name: Verify APK contents
        run: |
          set -e
          for a in out/Tubify-v0.1.13-*.apk; do
            echo "== $a =="
            unzip -l "$a" | grep -q 'assets/tweaks/manifest.json'
            unzip -l "$a" | grep -q 'assets/tweaks/content.js'
            # AGP resource shrinking renames res paths; icon reference lives in resources.arsc
            unzip -p "$a" resources.arsc | strings | grep -q 'ic_launcher'
            unzip -p "$a" classes.dex | strings | grep -q 'addons.mozilla.org/firefox/downloads/latest/ublock-origin'
            unzip -p "$a" classes.dex | strings | grep -q 'tweaks@tubify.app'
            unzip -p "$a" classes.dex | strings | grep -q 'm.youtube.com'
            unzip -p "$a" assets/tweaks/manifest.json | grep -q 'tweaks@tubify.app'
            unzip -p "$a" assets/tweaks/manifest.json | grep -q 'geckoViewAddons'
            unzip -p "$a" assets/tweaks/background.js | grep -q 'insertCSS'
            du -h "$a"
          done
          echo "== out/Tubify-Lite-v0.1.13.apk =="
          L=out/Tubify-Lite-v0.1.13.apk
          stat -c%s "$L"
          unzip -l "$L"
          test $(stat -c%s "$L") -lt 1000000
          test -z "$(unzip -l "$L" | grep 'lib/')"
          unzip -p "$L" classes.dex | strings | grep -q 'm.youtube.com'
          unzip -p "$L" classes.dex | strings | grep -q 'doubleclick.net'
          unzip -p "$L" resources.arsc | strings | grep -q 'ic_launcher'
          du -h "$L"

      - name: Verify signing and manifest facts
        run: |
          set -e
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          for a in out/*.apk; do
            echo "== $a =="
            apksigner verify --print-certs "$a" | grep 'SHA-256' | head -1
            aapt dump badging "$a" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code):" | head -6
          done

      - name: Publish release v0.1.13
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          SIZES=""
          for f in *.apk; do SIZES="$SIZES $f: $(du -h "$f" | cut -f1)."; done
          NOTES="Tubify v0.1.13: packaging and install robustness. Assets now sort with the universal APK first: START WITH Tubify-v0.1.13-0-universal.apk - it works on every device (arm64, armeabi-v7a, x86_64) but is large (~237 MB, GeckoView inside); pick an architecture APK (arm64-v8a for most phones, ~89 MB) to save space. INSTALL TROUBLESHOOTING for 'App not installed': 1) uninstall any older Tubify/Tubify Lite first (early test builds may carry a different signing key - Android refuses cross-key updates; your settings/toggles reset, nothing else is lost), 2) free at least 1 GB before installing the universal APK (the Galaxy Tab A6's 16 GB storage fills fast; the arm64 APK needs much less), 3) do not install an older version over a newer one. Full build also gains a thin red loading progress bar under the top edge. Every APK is verified in CI for signature (permanent Tubify key, cert SHA-256 c0891ff4...) and manifest facts (minSdk 26, per-ABI native libs). Sizes:$SIZES Includes v0.1.12's hide-home-feed toggle and the v0.1.11 Material 3 dark UI. Tubify-Lite is the tiny WebView build (<1MB)."
          gh release view v0.1.13 >/dev/null 2>&1 && gh release delete v0.1.13 --yes || true
          gh release create v0.1.13 --title "Tubify v0.1.13" --notes "$NOTES" --latest *.apk
