name: Tubify release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Tubify source
        run: |
          set -e
          if [ ! -f app/build.gradle.kts ]; then
            tar xzf src.tar.gz
          fi
          git config user.email "tubify-ci@users.noreply.github.com"
          git config user.name "Tubify CI"
          git add -A
          git diff --cached --quiet || git commit -m "Tubify source (CI)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Decode keystore
        run: |
          mkdir -p /tmp/sign
          echo "${{ secrets.TUBIFY_KEYSTORE_B64 }}" | base64 -d > /tmp/sign/tubify.p12

      - name: Build release APKs
        env:
          TUBIFY_STORE_FILE: /tmp/sign/tubify.p12
          TUBIFY_STORE_PASSWORD: ${{ secrets.TUBIFY_KEYSTORE_PASSWORD }}
          TUBIFY_KEY_PASSWORD: ${{ secrets.TUBIFY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :lite:assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -e
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *universal-release.apk) cp "$f" out/Tubify-v0.1.48-0-universal.apk ;;
              *arm64-v8a-release.apk) cp "$f" out/Tubify-v0.1.48-arm64-v8a.apk ;;
              *armeabi-v7a-release.apk) cp "$f" out/Tubify-v0.1.48-armeabi-v7a.apk ;;
              *x86_64-release.apk) cp "$f" out/Tubify-v0.1.48-x86_64.apk ;;
            esac
          done
          ls -l out
          for n in 0-universal arm64-v8a armeabi-v7a x86_64; do test -f "out/Tubify-v0.1.48-$n.apk"; done
          cp lite/build/outputs/apk/release/lite-release.apk out/Tubify-Lite-v0.1.48.apk
          test -f out/Tubify-Lite-v0.1.48.apk

      - name: Verify APK contents
        run: |
          set -e
          for a in out/Tubify-v0.1.48-*.apk; do
            echo "== $a =="
            unzip -l "$a" | grep -q 'assets/tweaks/manifest.json'
            unzip -l "$a" | grep -q 'assets/tweaks/content.js'
            # AGP resource shrinking renames res paths; icon reference lives in resources.arsc
            unzip -p "$a" resources.arsc | strings | grep -q 'ic_launcher'
            unzip -p "$a" classes.dex | strings | grep -q 'addons.mozilla.org/firefox/downloads/latest/ublock-origin'
            unzip -p "$a" classes.dex | strings | grep -q 'tweaks@tubify.app'
            unzip -p "$a" classes.dex | strings | grep -q 'm.youtube.com'
            unzip -p "$a" assets/tweaks/manifest.json | grep -q 'tweaks@tubify.app'
            unzip -p "$a" assets/tweaks/manifest.json | grep -q 'geckoViewAddons'
            unzip -p "$a" assets/tweaks/background.js | grep -q 'insertCSS'
            du -h "$a"
          done
          echo "== out/Tubify-Lite-v0.1.48.apk =="
          L=out/Tubify-Lite-v0.1.48.apk
          stat -c%s "$L"
          unzip -l "$L"
          test $(stat -c%s "$L") -lt 1000000
          test -z "$(unzip -l "$L" | grep 'lib/')"
          unzip -p "$L" classes.dex | strings | grep -q 'm.youtube.com'
          unzip -p "$L" classes.dex | strings | grep -q 'doubleclick.net'
          unzip -p "$L" resources.arsc | strings | grep -q 'ic_launcher'
          du -h "$L"

      - name: Verify signing and manifest facts
        run: |
          set -e
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          for a in out/*.apk; do
            echo "== $a =="
            apksigner verify --print-certs "$a" | grep 'SHA-256' | head -1
            aapt dump badging "$a" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code):" | head -6
          done

      - name: Upload APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lite, pkg: com.tubify.lite, wait: 35, gate: true }
          - { name: full, pkg: com.tubify.app, wait: 75, gate: false }
    continue-on-error: ${{ !matrix.gate }}
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test ${{ matrix.name }} on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: set -e; echo "[$(date +%T)] start ${{ matrix.name }}"; if [ "${{ matrix.name }}" = lite ]; then APK=$(ls "$GITHUB_WORKSPACE"/out/Tubify-Lite-*.apk | head -1); else APK=$(ls "$GITHUB_WORKSPACE"/out/Tubify-v*-x86_64.apk | head -1); fi; echo "[$(date +%T)] installing $APK"; test -f "$APK"; adb install -r --no-incremental "$APK"; echo "[$(date +%T)] installed"; adb shell monkey -p ${{ matrix.pkg }} -c android.intent.category.LAUNCHER 1; echo "[$(date +%T)] launched"; sleep ${{ matrix.wait }}; echo "[$(date +%T)] pidof"; adb shell pidof ${{ matrix.pkg }}; echo "[$(date +%T)] screencap"; timeout 90 adb shell "screencap -p /sdcard/shot.png" || true; timeout 60 adb pull /sdcard/shot.png "$GITHUB_WORKSPACE/shot-${{ matrix.name }}.png" || true; if [ ! -s "$GITHUB_WORKSPACE/shot-${{ matrix.name }}.png" ]; then timeout 60 adb exec-out screencap -p > "$GITHUB_WORKSPACE/shot-${{ matrix.name }}.png" || true; fi; if [ -s "$GITHUB_WORKSPACE/shot-${{ matrix.name }}.png" ]; then echo "[$(date +%T)] screencap ok"; else echo "SCREENCAP FAILED (non-fatal)"; fi; adb logcat -d > "$GITHUB_WORKSPACE/logcat.txt"; echo "[$(date +%T)] logcat done"; ! grep -q "FATAL EXCEPTION" "$GITHUB_WORKSPACE/logcat.txt"; adb shell uiautomator dump /sdcard/ui.xml >/dev/null; adb pull /sdcard/ui.xml "$GITHUB_WORKSPACE/ui.xml" >/dev/null; echo "[$(date +%T)] uidump done"; if [ "${{ matrix.name }}" = lite ]; then grep -q 'TUBIFY_TWEAK shorts pivot=[1-9]' "$GITHUB_WORKSPACE/logcat.txt" || { echo "SHORTS PIVOT NOT HIDDEN (lite)"; exit 1; }; grep -q 'TUBIFY_TWEAK adclean on' "$GITHUB_WORKSPACE/logcat.txt" || { echo "AD CLEANER NOT ACTIVE (lite)"; exit 1; }; for T in dark light auto; do adb shell am force-stop com.tubify.lite; adb shell am start -n com.tubify.lite/.MainActivity -e tubify_theme $T --ez tubify_open_settings true >/dev/null; sleep 12; timeout 60 adb shell "screencap -p /sdcard/theme-$T.png" || true; timeout 60 adb pull /sdcard/theme-$T.png "$GITHUB_WORKSPACE/theme-$T.png" || true; done; adb shell am force-stop com.tubify.lite; else true; fi; echo "SMOKE OK ${{ matrix.name }}"

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: |
            shot-${{ matrix.name }}.png
            logcat.txt
            ui.xml
            theme-*.png

  publish:
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: out

      - name: Download smoke evidence (Full)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: smoke-full
          path: smoke-full

      - name: Download smoke evidence (Lite)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: smoke-lite
          path: smoke-lite

      - name: Publish release v0.1.48
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          SIZES=""
          for f in *.apk; do SIZES="$SIZES $f: $(du -h "$f" | cut -f1)."; done
          NOTES="Tubify v0.1.48: New defaults on first launch and after Reset: Shorts, suggestions, comments and home feed are no longer hidden. Ads blocked and Auto theme stay on. Turning Block ads off reloads the page, and Full has one plain Block ads switch. Requires Android 10+. Sizes:$SIZES Start with the universal APK."
          gh release view v0.1.48 >/dev/null 2>&1 && gh release delete v0.1.48 --yes || true
          gh release create v0.1.48 --title "Tubify v0.1.48" --notes "$NOTES" --latest *.apk
          cd ..
