      - name: Commit source to main
        run: |
          git config user.email "tubify-ci@users.noreply.github.com"
          git config user.name "Tubify CI"
          git add -A
          git diff --cached --quiet || git commit -m "Tubify source (CI)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true


