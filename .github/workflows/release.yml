name: Tubify release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Tubify source
        run: |
          set -e
          if [ ! -f app/build.gradle.kts ]; then
            tar xzf src.tar.gz
          fi
          git config user.email "tubify-ci@users.noreply.github.com"
          git config user.name "Tubify CI"
          git add -A
          git diff --cached --quiet || git commit -m "Tubify source (CI)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Decode keystore
        run: |
          mkdir -p /tmp/sign
          echo "${{ secrets.TUBIFY_KEYSTORE_B64 }}" | base64 -d > /tmp/sign/tubify.p12

      - name: Build release APKs
        env:
          TUBIFY_STORE_FILE: /tmp/sign/tubify.p12
          TUBIFY_STORE_PASSWORD: ${{ secrets.TUBIFY_KEYSTORE_PASSWORD }}
          TUBIFY_KEY_PASSWORD: ${{ secrets.TUBIFY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :lite:assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -e
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *universal-release.apk) cp "$f" out/Tubify-v0.1.10-all.apk ;;
              *arm64-v8a-release.apk) cp "$f" out/Tubify-v0.1.10-arm64-v8a.apk ;;
              *armeabi-v7a-release.apk) cp "$f" out/Tubify-v0.1.10-armeabi-v7a.apk ;;
              *x86_64-release.apk) cp "$f" out/Tubify-v0.1.10-x86_64.apk ;;
            esac
          done
          ls -l out
          for n in all arm64-v8a armeabi-v7a x86_64; do test -f "out/Tubify-v0.1.10-$n.apk"; done
          cp lite/build/outputs/apk/release/lite-release.apk out/Tubify-Lite-v0.1.10.apk
          test -f out/Tubify-Lite-v0.1.10.apk

      - name: Verify APK contents
        run: |
          set -e
          for a in out/Tubify-v0.1.10-*.apk; do
            echo "== $a =="
            unzip -l "$a" | grep -q 'assets/tweaks/manifest.json'
            unzip -l "$a" | grep -q 'assets/tweaks/content.js'
            # AGP resource shrinking renames res paths; icon reference lives in resources.arsc
            unzip -p "$a" resources.arsc | strings | grep -q 'ic_launcher'
            unzip -p "$a" classes.dex | strings | grep -q 'addons.mozilla.org/firefox/downloads/latest/ublock-origin'
            unzip -p "$a" classes.dex | strings | grep -q 'tweaks@tubify.app'
            unzip -p "$a" classes.dex | strings | grep -q 'm.youtube.com'
            unzip -p "$a" assets/tweaks/manifest.json | grep -q 'tweaks@tubify.app'
            unzip -p "$a" assets/tweaks/manifest.json | grep -q 'geckoViewAddons'
            unzip -p "$a" assets/tweaks/background.js | grep -q 'insertCSS'
            du -h "$a"
          done
          echo "== out/Tubify-Lite-v0.1.10.apk =="
          L=out/Tubify-Lite-v0.1.10.apk
          stat -c%s "$L"
          unzip -l "$L"
          test $(stat -c%s "$L") -lt 1000000
          test -z "$(unzip -l "$L" | grep 'lib/')"
          unzip -p "$L" classes.dex | strings | grep -q 'm.youtube.com'
          unzip -p "$L" classes.dex | strings | grep -q 'doubleclick.net'
          unzip -p "$L" resources.arsc | strings | grep -q 'ic_launcher'
          du -h "$L"

      - name: Publish release v0.1.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          SIZES=""
          for f in *.apk; do SIZES="$SIZES $f: $(du -h "$f" | cut -f1)."; done
          NOTES="Tubify v0.1.10: (1) YouTube's Open App prompts are gone in both builds - the top-bar pill, watch-metadata app promos and open-app bottom sheets are hidden, and youtube://, intent://, vnd.youtube: and market: links are swallowed so no app-launch intent ever fires. (2) Full: gear sheet now offers three blockers - uBlock Origin (default), AdGuard AdBlocker and AdBlock Plus, all MV2 builds installed from addons.mozilla.org, each with its own toggle and diagnostics status; enabling several shows a slowdown warning. (3) Lite: layered blocking - bigger built-in ad-domain list (ytcs ad telemetry, ad_break scoped to YouTube, ads.youtube.com), cosmetic ad CSS for feed/overlay ads, faster 350ms ad skipper with more skip-button selectors, googlevideo media URLs are never intercepted, and ad-telemetry CORS noise no longer reaches the error log. Honest limits: Lite's skipper reacts after an ad starts (a fraction of a second may play, muted), and ads baked into the stream (SABR) cannot be removed by a WebView build - use Full with uBlock for that. Signed with the permanent Tubify release key. 32-bit x86 is not published because GeckoView 161 ships no x86 native libraries. Sizes:$SIZES Pick the APK matching your device ABI, or the all APK when unsure (much larger). Tubify-Lite is a separate tiny WebView-based build (<1MB)."
          gh release view v0.1.10 >/dev/null 2>&1 && gh release delete v0.1.10 --yes || true
          gh release create v0.1.10 --title "Tubify v0.1.10" --notes "$NOTES" --latest *.apk
