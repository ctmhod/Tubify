      - name: Commit source to main
        run: |
          git config user.email "tubify-ci@users.noreply.github.com"
          git config user.name "Tubify CI"
          git add -A
          git diff --cached --quiet || git commit -m "Tubify source (CI)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Decode keystore
        run: |
          mkdir -p /tmp/sign
          echo "${{ secrets.TUBIFY_KEYSTORE_B64 }}" | base64 -d > /tmp/sign/tubify.p12

      - name: Build release APKs
        env:
          TUBIFY_STORE_FILE: /tmp/sign/tubify.p12
          TUBIFY_STORE_PASSWORD: ${{ secrets.TUBIFY_KEYSTORE_PASSWORD }}
          TUBIFY_KEY_PASSWORD: ${{ secrets.TUBIFY_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -e
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *arm64-v8a-release.apk) cp "$f" out/Tubify-v0.1.0-arm64-v8a.apk ;;
              *armeabi-v7a-release.apk) cp "$f" out/Tubify-v0.1.0-armeabi-v7a.apk ;;
            esac
          done
          ls -l out
          test -f out/Tubify-v0.1.0-arm64-v8a.apk
          test -f out/Tubify-v0.1.0-armeabi-v7a.apk

      - name: Verify APK contents
        run: |
          set -e
          for a in out/*.apk; do
            echo "== $a =="
            unzip -l "$a" | grep -q 'assets/tweaks/manifest.json'
            unzip -l "$a" | grep -q 'assets/tweaks/content.js'
            unzip -l "$a" | grep -qE 'mipmap-xxxhdpi(-v4)?/ic_launcher.png'
            unzip -p "$a" classes.dex | strings | grep -q 'addons.mozilla.org/firefox/downloads/latest/ublock-origin'
            unzip -p "$a" classes.dex | strings | grep -q 'tweaks@tubify.app'
            unzip -p "$a" classes.dex | strings | grep -q 'm.youtube.com'
            unzip -p "$a" assets/tweaks/manifest.json | grep -q 'tweaks@tubify.app'
            du -h "$a"
          done

      - name: Publish release v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          A64=$(du -h Tubify-v0.1.0-arm64-v8a.apk | cut -f1)
          AV7=$(du -h Tubify-v0.1.0-armeabi-v7a.apk | cut -f1)
          NOTES="First Tubify release. GeckoView engine with uBlock Origin (installed from addons.mozilla.org on first run) and a bundled Tubify Tweaks extension. Gear menu toggles: ad blocking, hide Shorts, hide suggestions, hide comments. Signed with the permanent Tubify release key. Sizes: arm64-v8a $A64, armeabi-v7a $AV7."
          gh release view v0.1.0 >/dev/null 2>&1 && gh release delete v0.1.0 --yes || true
          gh release create v0.1.0 --title "Tubify v0.1.0" --notes "$NOTES" --latest *.apk
