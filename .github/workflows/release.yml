name: Tubify release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Tubify source
        run: |
          set -e
          if [ ! -f app/build.gradle.kts ]; then
            tar xzf src.tar.gz
          fi
          git config user.email "tubify-ci@users.noreply.github.com"
          git config user.name "Tubify CI"
          git add -A
          git diff --cached --quiet || git commit -m "Tubify source (CI)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Decode keystore
        run: |
          mkdir -p /tmp/sign
          echo "${{ secrets.TUBIFY_KEYSTORE_B64 }}" | base64 -d > /tmp/sign/tubify.p12

      - name: Build release APKs
        env:
          TUBIFY_STORE_FILE: /tmp/sign/tubify.p12
          TUBIFY_STORE_PASSWORD: ${{ secrets.TUBIFY_KEYSTORE_PASSWORD }}
          TUBIFY_KEY_PASSWORD: ${{ secrets.TUBIFY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :lite:assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -e
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *universal-release.apk) cp "$f" out/Tubify-v0.1.18-0-universal.apk ;;
              *arm64-v8a-release.apk) cp "$f" out/Tubify-v0.1.18-arm64-v8a.apk ;;
              *armeabi-v7a-release.apk) cp "$f" out/Tubify-v0.1.18-armeabi-v7a.apk ;;
              *x86_64-release.apk) cp "$f" out/Tubify-v0.1.18-x86_64.apk ;;
            esac
          done
          ls -l out
          for n in 0-universal arm64-v8a armeabi-v7a x86_64; do test -f "out/Tubify-v0.1.18-$n.apk"; done
          cp lite/build/outputs/apk/release/lite-release.apk out/Tubify-Lite-v0.1.18.apk
          test -f out/Tubify-Lite-v0.1.18.apk

      - name: Verify APK contents
        run: |
          set -e
          for a in out/Tubify-v0.1.18-*.apk; do
            echo "== $a =="
            unzip -l "$a" | grep -q 'assets/tweaks/manifest.json'
            unzip -l "$a" | grep -q 'assets/tweaks/content.js'
            # AGP resource shrinking renames res paths; icon reference lives in resources.arsc
            unzip -p "$a" resources.arsc | strings | grep -q 'ic_launcher'
            unzip -p "$a" classes.dex | strings | grep -q 'addons.mozilla.org/firefox/downloads/latest/ublock-origin'
            unzip -p "$a" classes.dex | strings | grep -q 'tweaks@tubify.app'
            unzip -p "$a" classes.dex | strings | grep -q 'm.youtube.com'
            unzip -p "$a" assets/tweaks/manifest.json | grep -q 'tweaks@tubify.app'
            unzip -p "$a" assets/tweaks/manifest.json | grep -q 'geckoViewAddons'
            unzip -p "$a" assets/tweaks/background.js | grep -q 'insertCSS'
            du -h "$a"
          done
          echo "== out/Tubify-Lite-v0.1.18.apk =="
          L=out/Tubify-Lite-v0.1.18.apk
          stat -c%s "$L"
          unzip -l "$L"
          test $(stat -c%s "$L") -lt 1000000
          test -z "$(unzip -l "$L" | grep 'lib/')"
          unzip -p "$L" classes.dex | strings | grep -q 'm.youtube.com'
          unzip -p "$L" classes.dex | strings | grep -q 'doubleclick.net'
          unzip -p "$L" resources.arsc | strings | grep -q 'ic_launcher'
          du -h "$L"

      - name: Verify signing and manifest facts
        run: |
          set -e
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          for a in out/*.apk; do
            echo "== $a =="
            apksigner verify --print-certs "$a" | grep 'SHA-256' | head -1
            aapt dump badging "$a" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code):" | head -6
          done

      - name: Upload APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lite, pkg: com.tubify.lite, wait: 35 }
          - { name: full, pkg: com.tubify.app, wait: 75 }
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test ${{ matrix.name }} on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: set -e; if [ "${{ matrix.name }}" = lite ]; then APK=$(ls "$GITHUB_WORKSPACE"/out/Tubify-Lite-*.apk | head -1); else APK=$(ls "$GITHUB_WORKSPACE"/out/Tubify-v*-x86_64.apk | head -1); fi; echo "Installing $APK"; test -f "$APK"; adb install -r "$APK"; adb shell monkey -p ${{ matrix.pkg }} -c android.intent.category.LAUNCHER 1; sleep ${{ matrix.wait }}; adb shell pidof ${{ matrix.pkg }}; adb exec-out screencap -p > "$GITHUB_WORKSPACE/shot.png"; adb logcat -d > "$GITHUB_WORKSPACE/logcat.txt"; ! grep -q "FATAL EXCEPTION" "$GITHUB_WORKSPACE/logcat.txt"; echo "SMOKE OK ${{ matrix.name }}"

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: |
            shot.png
            logcat.txt

  publish:
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: out

      - name: Download smoke evidence (Full)
        uses: actions/download-artifact@v4
        with:
          name: smoke-full
          path: smoke-full

      - name: Download smoke evidence (Lite)
        uses: actions/download-artifact@v4
        with:
          name: smoke-lite
          path: smoke-lite

      - name: Publish release v0.1.18
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          SIZES=""
          for f in *.apk; do SIZES="$SIZES $f: $(du -h "$f" | cut -f1)."; done
          NOTES="Tubify v0.1.18: Lite error log no longer records intentionally blocked ad requests as errors, and labels media-stream (googlevideo) failures as media so real problems stand out. Carries all v0.1.16 features plus the CI emulator smoke test that gates this release (screenshots attached). Requires Android 10+. Sizes:$SIZES Start with the universal APK."
          gh release view v0.1.18 >/dev/null 2>&1 && gh release delete v0.1.18 --yes || true
          gh release create v0.1.18 --title "Tubify v0.1.18" --notes "$NOTES" --latest *.apk
          cd ..
          gh release upload v0.1.18 "smoke-full/shot.png#Tubify-v0.1.18-Full-emulator-Android10.png" "smoke-lite/shot.png#Tubify-v0.1.18-Lite-emulator-Android10.png"
