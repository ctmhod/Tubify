name: README screenshots
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to capture
        default: v0.1.58
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lite, pkg: com.tubify.lite, wait: 15, gpu: swiftshader_indirect, mem: 3072 }
          - { name: full, pkg: com.tubify.app, wait: 30, gpu: swangle_indirect, mem: 4096 }
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.name }}" = lite ]; then
            gh release download ${{ inputs.tag }} -p 'Tubify-Lite-*.apk' -O app.apk
          else
            gh release download ${{ inputs.tag }} -p '*-x86_64.apk' -O app.apk
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -memory ${{ matrix.mem }}
          disable-animations: true
          script: bash qa/readme-shots.sh ${{ matrix.pkg }} app.apk out ${{ matrix.wait }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.name }}
          path: out
          retention-days: 3
