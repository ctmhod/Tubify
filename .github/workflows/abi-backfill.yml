name: ABI backfill
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add missing architecture APKs to
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Take ABI splits config from main
        run: |
          git fetch origin main
          git checkout origin/main -- app/build.gradle.kts lite/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - name: Decode keystore
        run: |
          mkdir -p /tmp/sign
          echo "${{ secrets.TUBIFY_KEYSTORE_B64 }}" | base64 -d > /tmp/sign/tubify.p12
      - name: Build release APKs
        env:
          TUBIFY_STORE_FILE: /tmp/sign/tubify.p12
          TUBIFY_STORE_PASSWORD: ${{ secrets.TUBIFY_KEYSTORE_PASSWORD }}
          TUBIFY_KEY_PASSWORD: ${{ secrets.TUBIFY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :lite:assembleRelease --no-daemon
      - name: Verify and upload missing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=${{ inputs.tag }}
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          mkdir -p out
          cp app/build/outputs/apk/release/app-x86-release.apk "out/Tubify-$TAG-x86.apk"
          for f in lite/build/outputs/apk/release/*.apk; do
            case "$f" in
              *universal-release.apk) cp "$f" "out/Tubify-Lite-$TAG-0-universal.apk" ;;
              *arm64-v8a-release.apk) cp "$f" "out/Tubify-Lite-$TAG-arm64-v8a.apk" ;;
              *armeabi-v7a-release.apk) cp "$f" "out/Tubify-Lite-$TAG-armeabi-v7a.apk" ;;
              *-x86-release.apk) cp "$f" "out/Tubify-Lite-$TAG-x86.apk" ;;
              *x86_64-release.apk) cp "$f" "out/Tubify-Lite-$TAG-x86_64.apk" ;;
            esac
          done
          for a in out/*.apk; do
            $APKSIGNER verify --print-certs "$a" | grep -q 'c0891ff4'
          done
          HAVE=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for a in out/*.apk; do
            n=$(basename "$a")
            echo "$HAVE" | grep -qx "$n" || gh release upload "$TAG" "$a"
          done
          gh release view "$TAG" --json assets --jq '.assets[].name'
