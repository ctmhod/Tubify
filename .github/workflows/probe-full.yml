name: Tubify Full probe
on:
  workflow_dispatch:
    inputs:
      tag:
        default: v0.1.39
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: a29-swangle, api: 29, target: google_apis, gpu: swangle_indirect }
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ${{ inputs.tag }} -p '*-x86_64.apk' -D apks
      - name: Probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: bash qa/probe_full.sh "$(ls apks/*.apk | head -1)" probe-out
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.name }}
          path: probe-out
